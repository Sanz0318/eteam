server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rbac?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # update: 首次启动自动建表；也可手工执行 04-数据库设计 里的 SQL
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # HS256 要求密钥至少 32 字节
  secret: rbac-demo-secret-key-please-change-this-32bytes!
  expire-hours: 24
